services:
  9router:
    build:
      context: .
      args:
        NODE_USER_UID: ${NODE_USER_UID:-1000}
        NODE_USER_GID: ${NODE_USER_GID:-1000}
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
    volumes:
      - ./data:/home/node/.9router
    environment:
      - "NODE_ENV=production"
      # Optional: set initial admin password or JWT secret
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-}
      # - JWT_SECRET=${JWT_SECRET:-}
